schema_version: "1.1"
name: mirrored-column-order
held_out: false
context_in_other_file: false
evidence_in: [export/columns.py]
expected_outcome: |
  A point-of-edit control. COLUMNS in export/columns.py gains "currency" right after
  "amount", and ingest/layout.json lists the same columns in the same order, so an
  export reads back through ingest/read.py with every field under its own name. The
  pointer that says layout.json must mirror COLUMNS is in the module docstring of the
  file being edited, so no search is needed to find it. The docstring stays word for
  word, no Python code outside export/ and tests/ changes, and the visible tests pass.
  Updating COLUMNS alone passes the visible tests and shifts the bank's reading of
  every field after amount.
context:
  scaffold_script: place-files.sh
