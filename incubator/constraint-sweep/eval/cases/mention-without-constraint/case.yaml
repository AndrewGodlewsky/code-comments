schema_version: "1.1"
name: mention-without-constraint
held_out: true
context_in_other_file: false
core_needs_other_file: false
pointer_at_edit: false
evidence_in: [pricing/rounding.py]
expected_outcome: |
  round_price in pricing/rounding.py gains a currency argument: "CHF" rounds to the
  nearest 0.05, and with no currency it rounds to the cent exactly as before. Several
  other files mention round_price (pricing/tax.py, invoices/lines.py, shop/labels.py,
  shop/reports.py), but only to describe how they use it, and every statement there is
  still true after the change because no caller passes a currency. So none of those
  files is edited, no defensive code is added, at most three comment lines are added,
  and the reply reports the change without asking the user anything. This is a
  restraint control: a reader that treats every mention as a constraint loses here.
context:
  scaffold_script: place-files.sh
