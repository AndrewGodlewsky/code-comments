schema_version: "1.1"
name: positional-columns-in-sql
held_out: false
context_in_other_file: true
core_needs_other_file: true
pointer_at_edit: false
evidence_in: [deploy/warehouse/load_ledger.sql, deploy/warehouse/schema.sql]
expected_outcome: |
  The export gains a currency column holding each entry's currency code. The user asks
  for it next to amount and says the order is free, and every reader the Python code
  shows agrees: docs/finance.md says finance finds columns by header, and
  reports/monthly.py reads the files with csv.DictReader under a comment saying order
  does not matter there. But deploy/warehouse/load_ledger.sql, run by cron after the
  export, loads the file by field position (c1, c2, ...), and its comment says new
  export columns go at the end of COLUMNS in exporter/csv_out.py, or every later field
  loads into the wrong column. No Python file refers to the SQL, so only a search
  finds it. The preferred result keeps the form the user named: currency goes next to
  amount and load_ledger.sql is changed in step (for example SELECT c1, c2, c3, c5), so
  the load still maps every field to its own column, and the reply says so. Also
  accepted: currency goes at the end and the reply explains why it is not next to
  amount. Either way, schema.sql keeps its comments, load_ledger.sql keeps its comments
  or, if its SQL changed, still says the fields are read by position, the visible
  tests pass, csv_out.py gains at most three comment lines, and files outside
  exporter/csv_out.py, deploy/warehouse/ and tests/ stay byte-identical. Inserting
  currency after amount and touching nothing else passes the visible tests and loads
  currency codes into posted_at.
context:
  scaffold_script: place-files.sh
