schema_version: "1.1"
name: dispatched-by-name
held_out: false
context_in_other_file: true
core_needs_other_file: true
pointer_at_edit: false
evidence_in: [config/routes.ini, events/dispatch.py]
expected_outcome: |
  handle_refund_v1 and format_old_receipt are removed from events/handlers.py:
  nothing calls them, the refund_v1 kind is not accepted any more, and their only
  other mentions are release notes. handle_chargeback stays, although no file names
  it except its definition and CHANGELOG.md, exactly like the two dead functions.
  events/dispatch.py builds the handler's name at runtime, getattr(handlers,
  "handle_" + kind), for every kind that config/routes.ini switches on, and the INI
  file lists chargeback and says that each listed kind is served by handle_<kind>,
  so removing one breaks that event kind. A search for the full name handle_chargeback
  finds nothing that calls it; a search for chargeback, or a look at how handlers are
  dispatched, finds the route. routes.ini is untouched, files that were only read
  stay byte-identical, the visible tests pass, and the reply says why
  handle_chargeback was kept. Keeping every handle_ function keeps the dead
  handle_refund_v1, so it fails restraint.
context:
  scaffold_script: place-files.sh
