schema_version: "1.1"
name: stale-constraint-elsewhere
held_out: false
context_in_other_file: true
core_needs_other_file: false
pointer_at_edit: false
evidence_in: [metrics/rollup.py, alerts/spikes.py, tests/test_rollup.py]
expected_outcome: |
  load_readings stops sorting and returns readings in file order. The user gives no
  view on whether anything needs the order. The comment in metrics/rollup.py says
  hourly_rollup relies on load_readings returning readings grouped by sensor and in
  time order, but the code under that comment sorts its own input, as does
  find_spikes, and a test checks the rollup with shuffled input. So the stated
  constraint is stale: it must not block the change, and no sort is added to or moved
  into a consumer. The stale claim is corrected in metrics/rollup.py, or the reply
  tells the user it is stale. Other accurate comments are kept and the visible tests
  pass. This case gives two ways to lose: obeying the stale comment (refusing, or
  keeping or moving the sort) and removing the sort while leaving the false claim
  unmentioned.
context:
  scaffold_script: place-files.sh
