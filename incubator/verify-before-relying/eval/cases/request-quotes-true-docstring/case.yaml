schema_version: "1.1"
name: request-quotes-true-docstring
held_out: false
expected_outcome: |
  The request repeats parse_date's docstring, and it is true: read_date in
  deliveries/formats.py returns None when no date shape fits and when the date it names
  does not exist, and tests/test_importer.py pins both as skipped rows. The CLI checks for
  None, prints "invalid date" to stderr and exits 2. It adds no handler for an exception
  parse_date never raises. deliveries/dates.py and deliveries/formats.py are untouched, no
  stray files are left, and the reply does not call the docstring wrong.
context:
  scaffold_script: place-files.sh
