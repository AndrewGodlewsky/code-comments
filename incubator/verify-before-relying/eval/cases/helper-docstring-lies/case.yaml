schema_version: "1.1"
name: helper-docstring-lies
held_out: true
expected_outcome: |
  invoice_total rounds its total half up to the cent, so a total of 0.125 becomes 0.13.
  round_cents cannot do that: its docstring says halves round up, but it calls quantize
  with the decimal default, ROUND_HALF_EVEN, and tests/test_rounding.py pins 0.125 -> 0.12
  because the ledger must match the bank. round_cents keeps its behaviour, its docstring
  is corrected to say halves go to the even cent, and the reply tells the user why the
  helper was not used as asked. Extending round_cents is fine if existing calls still
  round half-even. No stray files are left.
context:
  scaffold_script: place-files.sh
