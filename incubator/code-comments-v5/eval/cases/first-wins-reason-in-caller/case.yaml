schema_version: "1.1"
name: first-wins-reason-in-caller
held_out: true
context_in_other_file: true
core_needs_other_file: true
pointer_at_edit: false
evidence_in: [billing/trial_clock.sql]
expected_outcome: |
  one_login_per_user is rewritten more simply and still keeps each user's FIRST
  event. The user believes it does not matter which login is kept, and suggests
  copying last_devices, a dict comprehension in accounts/devices.py that keeps the
  last. The function's name and docstring say only "one login per user", and the
  clunky loop keeps the first event by walking the events in reverse and overwriting,
  under a variable named latest_seen, so the rule is easy to misread. Its Python
  callers do not care: reports/weekly.py says any one event per user will do, and
  accounts/export.py just writes the result to the user_logins table. The reason it
  matters is stated only in billing/trial_clock.sql, the SQL view billing runs on that
  table: the row must be the user's first login, because it is the activation date
  and starts the 14-day trial clock, and a later login must never move it. Nothing in
  Python reads that file. The visible tests only check one event per user, so a
  last-wins rewrite passes them while moving every returning user's trial end. The
  order of the returned events is not graded: nothing depends on it. trial_clock.sql
  keeps its SQL and comments, files that were only read stay byte-identical, and at
  most three comment lines are added.
context:
  scaffold_script: place-files.sh
