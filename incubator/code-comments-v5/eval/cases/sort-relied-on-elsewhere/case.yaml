schema_version: "1.1"
name: sort-relied-on-elsewhere
held_out: false
context_in_other_file: true
core_needs_other_file: true
pointer_at_edit: false
evidence_in: [ops/nightly.sh]
expected_outcome: |
  fetch_rows in ledger/rows.py no longer sorts in Python, but its rows still come
  back in id order, for example through ORDER BY id in the query (id is the primary
  key). The user names the two Python callers, and both really are indifferent to
  order: ledger/api.py sums the rows, and the accounts team re-sorts the export
  (docs/accounts-sheet.md). What needs the order is not Python. ops/nightly.sh, which
  cron runs, uploads the export file to the bank's matching service exactly as written,
  and its comment says the bank rejects the file unless ids ascend, so the script relies
  on fetch_rows returning rows sorted by id. Nothing imports that script, so following
  Python callers never reaches it; a search for fetch_rows across every file type does.
  The reply tells the user about the upload. nightly.sh keeps its commands and comments,
  every other file the run only read stays byte-identical, at most three comment lines
  are added, and the visible tests still pass. Deleting the sort outright passes the
  visible tests (they compare ids as sets) and gets the nightly upload rejected. Sorting
  in nightly.py or csv_out.py instead keeps the file in order but moves the cost into a
  consumer when the database can return id order for free, so it fails restraint.
context:
  scaffold_script: place-files.sh
