# Prometheus for the station exporter: scrape it every 30 seconds and load the
# alert rules kept next to this file.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: pumpwatch
    static_configs:
      - targets: ["pumpwatch.waterboard.internal:9410"]
