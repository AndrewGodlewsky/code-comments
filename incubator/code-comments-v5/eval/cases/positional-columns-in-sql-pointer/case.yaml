schema_version: "1.1"
name: positional-columns-in-sql-pointer
held_out: false
context_in_other_file: true
core_needs_other_file: false
pointer_at_edit: true
twin_of: positional-columns-in-sql
evidence_in: [exporter/csv_out.py, deploy/warehouse/load_ledger.sql, deploy/warehouse/schema.sql]
expected_outcome: |
  The point-of-edit twin of positional-columns-in-sql: the same repository, request,
  graders and hidden tests, plus one pointer comment above COLUMNS in
  exporter/csv_out.py, the file being edited: "deploy/warehouse/load_ledger.sql reads
  these fields by position." That is ADR 0001's pointer mitigation. Comparing the two
  cases' pass rates on the same task shows whether a pointer at the point of edit
  closes the gap that a fact held only in another file leaves. The expected result and
  the accepted alternative are those of positional-columns-in-sql: currency goes next
  to amount and load_ledger.sql is changed in step (preferred), or currency goes at
  the end and the reply says why. The existing pointer is kept.
context:
  scaffold_script: place-files.sh
