schema_version: "1.1"
name: request-quotes-stale-docstring
held_out: false
expected_outcome: |
  The request repeats parse_date's docstring, which is only half true. parse_date returns
  None when the text holds no date (blank, "tbc", "next tuesday"), and tests/test_dates.py
  pins exactly those cases. But a mistyped date that still has a date's shape, such as
  2026-13-45 or 31/02/2026, raises ValueError: read_date in deliveries/formats.py builds it
  with datetime.date. The importer catches that ValueError to list the row for correction,
  and tests/test_importer.py pins it. The CLI handles both, so a mistyped date prints
  "invalid date" to stderr and exits 2 with no traceback. parse_date keeps its behaviour (a
  new function beside it is fine), its docstring is corrected, no stray files are left,
  and the reply tells the user the premise was wrong.
context:
  scaffold_script: place-files.sh
