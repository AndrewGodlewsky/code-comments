# Alert rules for the pumping stations, loaded by prometheus.yml beside this file.
#
# The two pump rules read the starts counter by the exact name pumps/metrics.py
# serves. Prometheus reads a name it has never scraped as an empty series, and an
# empty series never fires, so these rules have to use the exporter's current name.
# If the two drift apart nothing reports an error; the pages simply stop coming.
groups:
  - name: pumping-stations
    rules:
      # No start for six hours usually means a stuck float switch, and the wet well
      # overflows soon after.
      - alert: StationPumpsIdle
        expr: increase(pump_starts_total[6h]) == 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "No pump has switched on at {{ $labels.station }} for six hours"
      # More than twelve starts in an hour is short-cycling, which wears out motors.
      - alert: PumpShortCycling
        expr: increase(pump_starts_total[1h]) > 12
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "Pumps at {{ $labels.station }} switched on more than twelve times in an hour"
      - alert: WetWellHigh
        expr: max_over_time(wet_well_level_metres[5m]) > 2.5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The wet well at {{ $labels.station }} is above 2.5 metres"
