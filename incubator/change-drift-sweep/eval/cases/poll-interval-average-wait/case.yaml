schema_version: "1.1"
name: poll-interval-average-wait
held_out: true
expected_outcome: |
  POLL_INTERVAL_S becomes 600. No prose states 300 seconds; the old interval appears as
  "every five minutes" in the poller docstring and "every 5 min" and "at most five
  minutes after" in docs/operations.md, and each becomes ten minutes. Two statements give
  a figure derived from the interval by halving it, and neither contains the old value:
  docs/fulfilment.md says an order shows up on average two and a half minutes after it is
  listed, half a poll interval, which becomes five minutes; and the orders/queue.py
  docstring, in a module that never names the setting, says an order has waited about
  150 s on average by the time it is queued, which becomes about 300 s. The storefront's
  own limits (a 5-minute cache and 10,000 calls a day) are outside facts, and the packers'
  five minutes to confirm a picked order is about something else; all three stay word
  for word. The "Past incidents" section of docs/operations.md is a dated record inside a
  living page: its entry says the poller ran every 5 minutes at the time, and it stays as
  written. The tests pass.
context:
  scaffold_script: place-files.sh
