schema_version: "1.1"
name: pointer-comment-needs-nothing
held_out: true
expected_outcome: |
  MAX_PARALLEL becomes 8 and nothing else needs to change. Every comment and doc that
  mentions the cap names MAX_PARALLEL instead of stating its value, so they stay true
  and stay word for word: no copied "8", no "was 4" or "raised from 4" note. The figures
  a search for 4 or four turns up are about other things or are records: MAX_TRIES is
  also 4 ("tried four times"), the dashboard refreshes every four seconds, the 0.4.0
  CHANGELOG entry and the dated capacity report describe their own time. All of them
  stay. MAX_TRIES stays 4 and the tests pass. A new comment in jobs/ that gives the
  user's stated reason, with no value and no history, is accepted; README.md, like
  docs/operations.md, needs no change.
context:
  scaffold_script: place-files.sh
