schema_version: "1.1"
name: unit-spelled-ttl
expected_outcome: |
  SESSION_TTL_S becomes 1800. No code or doc states the idle timeout in seconds, so a
  search for 900 finds no prose; the statements are a number word in the
  auth/sessions.py module docstring, a number word in the sign_in docstring in
  auth/views.py (which never names the setting), and "15 min" in docs/security.md. Each
  is corrected to thirty minutes. Two more never contain 15 or fifteen: the
  auth/forms.py docstring says a form left idle for "a quarter of an hour" can no longer
  be saved, which becomes half an hour; and docs/console.md says the "Still there?"
  banner appears after 14 minutes, which is the timeout less IDLE_WARNING_S (60 s) and
  becomes 29 minutes. The same figure appears in true statements about other things:
  password-reset links (their own 900-second setting), the lockout after 15 failed
  sign-ins, and the identity provider's 15-minute tokens, an outside fact. Those stay
  word for word, the other settings keep their values, and the tests pass.
context:
  scaffold_script: place-files.sh
