schema_version: "1.1"
name: derived-backoff-total
expected_outcome: |
  MAX_ATTEMPTS becomes 6, so a failing alert is posted six times with waits of 1, 2, 4,
  8 and 16 seconds and is dropped about 31 seconds after the first try. Every statement
  derived from the old count is recomputed: "four attempts" in the sender docstring, the
  wait list and the 7-second total in the loop comment, the "about seven seconds" drop
  time in docs/oncall.md (which never names the attempt count), and the storm figure of
  200 POSTs (50 alerts times four attempts), which becomes 300. Two more contain no 4,
  four, 7 or seven: the gateway-maintenance runbook says the sender retries each alert
  three times (attempts less one), which becomes five; and the alerts/worker.py
  docstring says a backlog of 40 alerts clears in under five minutes in a full outage
  (40 times about 7 s), which becomes about 21 minutes (40 times about 31 s). Unrelated
  figures that share a digit stay: the 7-day outbox retention, the 503 draining note and
  the BASE_DELAY_S comment. The tests pass.
context:
  scaffold_script: place-files.sh
