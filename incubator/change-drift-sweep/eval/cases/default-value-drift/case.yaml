schema_version: "1.1"
name: default-value-drift
expected_outcome: |
  PAGE_SIZE becomes 200 and the exporter asks for 200 rows a request. Every living
  statement of the old page size is corrected or removed, including the number word in
  the exporter/sync.py module docstring, which does not name PAGE_SIZE, as well as the
  client docstring and docs/api.md. The dated load-test report and the released
  CHANGELOG entries stay word for word, because they are true about their dates. The
  ledger team's 500-row limit in docs/limits.md is an outside fact and stays. Accurate
  comments, such as "Pages are numbered from 1", are left alone, and the tests pass.
context:
  scaffold_script: place-files.sh
