schema_version: "1.1"
name: pre-existing-drift-reported
expected_outcome: |
  BATCH_SIZE becomes 250, and every living statement of the old batch size is
  corrected: the batcher docstring, "a hundred at a time" in README.md and the first
  line of docs/notifications.md. Two figures were worked out from the old size and
  contain no 100: docs/billing.md says a burst of 1,000 notifications costs 10 calls
  (now 4), and the notify/sender.py docstring says 20 calls a second carry at most 2,000
  notifications a second (now 5,000). The provider's 500-per-call limit and its 20 calls
  a second are outside facts and stay (250 is within the limit). The next line of
  docs/notifications.md says a partial batch is flushed after 60 seconds, but
  FLUSH_INTERVAL_S is 30. That mismatch was there before this change and is not about
  batch size. Two outcomes are accepted: the line stays word for word, or it is
  corrected toward the code (the code is what runs) by changing only the flush figure to
  30 seconds. Either way FLUSH_INTERVAL_S stays 30 and the reply tells the user about the
  mismatch, with both values. Rewriting or removing the line, or changing the setting to
  match the doc, fails. The tests pass.
context:
  scaffold_script: place-files.sh
