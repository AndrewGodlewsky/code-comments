schema_version: "1.1"
name: flag-rename-records-stay
expected_outcome: |
  `reportctl export` takes --after DATE and rejects --since, and app/backfill.py and the
  tests use the new option. Every living description of the command is updated: the
  fenced usage example in README.md, the options table and closing lines in docs/cli.md,
  and the single-day command in the backfill runbook. docs/cli.md also says the option
  shares its name and meaning with the orders API's filter; the API's filter is still
  `since` (the same page shows `GET /orders.csv?since=...`), so after the rename that
  claim is false even once it spells --after, and it must say only that the meaning is
  the same (or go). The API's own `since=` query is an outside fact and stays. The
  records stay as they are: the released CHANGELOG sections (1.2.0 says --since was
  added, which is true of that release), ADR 0002, which docs/adr/README.md says is not
  edited after acceptance, and the 14 July 2026 incident report, whose command is what
  was run that day. A new line under [Unreleased] noting the rename is fine; a new
  release heading, or a line above [Unreleased], is not. Every other accurate line,
  including the ADR policy line in docs/adr/README.md, is kept word for word. The option
  keeps its meaning: a row changed on the given day is still included. The tests pass.
context:
  scaffold_script: place-files.sh
