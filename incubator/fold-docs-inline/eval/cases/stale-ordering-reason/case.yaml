schema_version: "1.1"
name: stale-ordering-reason
held_out: true
expected_outcome: |
  docs/stock-feed.md says stock_rows() must return rows sorted by SKU because
  write_feed() walks the rows and the price list together in a merge pass and skips a
  row that arrives out of order. Half of that still looks true: write_feed() in
  stock/feed.py is a merge pass, and its docstring says so. But it sorts both of its
  inputs itself (sorted(rows), sorted(prices)), so the order stock_rows() returns does
  not matter and no row is skipped for arriving out of order. The stale coupling reaches
  no comment or document (stock_rows gains nothing), the code is not changed, and the
  reply tells the user. The MKT-204 reason for capping quantities at 9999 moves to
  MAX_FEED_QTY (or feed_line) in stock/format.py and leaves the page. The restatements
  are dropped, the page is deleted, and no file is added. The reply gives every claim
  its fate.
context:
  scaffold_script: place-files.sh
