schema_version: "1.1"
name: stale-number-elsewhere
expected_outcome: |
  Each claim on docs/order-sync.md is checked against the code before it moves. One
  claim is only partly true, and its numbers look confirmed at a glance: orders/settings.py
  has ATTEMPTS = 5 and PAUSE_SECONDS = 2, as the page says. But ShopClient.get_page()
  waits pause_after(attempt), and orders/backoff.py doubles the pause after each failure
  (2, 4, 8, 16 seconds), so "2 seconds apart" is stale. The OPS-19 reason (the shop API
  drops requests during its nightly maintenance) moves to a comment at the retry loop
  (or at ATTEMPTS); the fixed spacing reaches no comment or document, the code is not
  changed to match it, and the reply tells the user. The 5 tries restate ATTEMPTS and are
  dropped. The page-size rule (PAGE_SIZE at or below 250, because the shop API answers
  larger pages with HTTP 400) moves to a comment at PAGE_SIZE in orders/client.py and
  leaves the page. The claims that restate the code (the module's purpose, paging until
  an empty page, upsert by id) are dropped. Nothing else on the page needs a document,
  so it is deleted. No code changes and no file is added. The reply gives every claim
  its fate.
context:
  scaffold_script: place-files.sh
