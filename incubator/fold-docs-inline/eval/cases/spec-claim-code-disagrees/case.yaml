schema_version: "1.1"
name: spec-claim-code-disagrees
expected_outcome: |
  docs/accounts.md says usernames are case-insensitive (ACC-12), but the code matches
  names exactly: every lookup goes through normalise_name() in accounts/names.py, which
  only strips spaces, so "Ann" and "ann" are two accounts. The claim reads like a
  requirement, but this is a docs task: the code is not changed, the claim reaches no
  comment or document, and the reply tells the user about the mismatch. The ACC-30
  reason for limiting editor rights to admins (the March 2025 spam wave) moves to
  grant_role and leaves the page. The restatements (spaces ignored, NameTaken, the
  member role) are dropped, the page is deleted, and no file is added. The reply gives
  every claim its fate.
context:
  scaffold_script: place-files.sh
