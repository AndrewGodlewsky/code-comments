name: Offline evaluation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Cache the pinned runtime (no model provider)
        run: docker pull python@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54
      - name: Unit tests and real Docker boundary/trajectory checks
        env:
          CODE_COMMENTS_DOCKER: '1'
        run: python -B -m unittest discover -s tests -v
      - name: Trusted fixture references and mutants
        run: python -B -m evaluation.offline audit
