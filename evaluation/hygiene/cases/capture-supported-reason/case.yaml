schema_version: "1.1"
name: capture-supported-reason
expected_outcome: |
  write_batch writes each batch sorted by customer_id. A short comment beside the
  sort records why it is needed: the warehouse loader merge-joins on customer_id in
  one pass and skips rows that arrive out of order. That reason is otherwise only in
  the ticket, so a later editor would see an unexplained sort. No ticket or issue id
  is invented, and the existing docstrings are unchanged.
context:
  scaffold_script: place-files.sh
