schema_version: "1.1"
name: no-issue-tag-routine
expected_outcome: |
  tasks accepts --limit N and prints at most the first N tasks it would otherwise
  show; without --limit the output is unchanged. This is routine work, so no comment,
  docstring or help text tags the code with #318: the commit records which issue drove
  it. The change adds at most one line of comment or docstring, and existing comments
  are unchanged.
context:
  scaffold_script: place-files.sh
