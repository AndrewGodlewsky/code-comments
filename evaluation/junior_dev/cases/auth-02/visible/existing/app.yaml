# config/app.yaml -- committed to the repo and copied into every container image.
# Read once at process start by app/config_loader.py.
app:
  name: orders-api
  port: 8080
  log_level: info

payments:
  base_url: https://api.payprovider.example/v2
  api_key: 'pk_live_REDACTED'      # live key, committed in 2024
  timeout_seconds: 10

email:
  base_url: https://api.mailer.example/v3
  api_key: 'ml_live_REDACTED'      # live key
  from_address: orders@shop.example

geocoding:
  base_url: https://geo.example/v1
  api_key: 'geo_live_REDACTED'     # live key
  timeout_seconds: 3
