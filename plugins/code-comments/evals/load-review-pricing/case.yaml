schema_version: "1.1"
name: load-review-pricing
description: A code review request that never mentions comments. The skill should load.
tags: [activation, should-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Review ledger/pricing.py and tell me what is wrong with it. Don't change anything yet.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: loads-code-comments
    tool: Skill
    input_match: code-comments
    min: 1
    arm: both
  - type: regex
    name: finds-double-discount
    pattern: twice|double|two times
    flags: i
    match: contains
expected_outcome: Claude loads the code-comments skill and reports that the coupon is subtracted twice.
