schema_version: "1.1"
name: load-comment-refresh
description: A comment-only refresh request. The skill should load.
tags: [activation, should-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Some of the comments in ledger/sync.py look out of date. Can you tidy them up so they match the code?
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: loads-code-comments
    tool: Skill
    input_match: code-comments
    min: 1
    arm: both
  - type: regex
    name: stale-attempt-count-gone
    target: {source: file, path: ledger/sync.py}
    pattern: up to 5 attempts
    match: not_contains
expected_outcome: Claude loads the code-comments skill and removes or corrects the stale "up to 5 attempts" comment.
