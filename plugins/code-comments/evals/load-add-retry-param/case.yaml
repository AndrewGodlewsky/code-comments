schema_version: "1.1"
name: load-add-retry-param
description: A feature edit that never mentions comments. The skill should load.
tags: [activation, should-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Make the number of retries in ledger/sync.py configurable. Add a max_retries argument to push() and pass it through to fetch_with_retry.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: loads-code-comments
    tool: Skill
    input_match: code-comments
    min: 1
    arm: both
  - type: regex
    name: push-takes-max-retries
    target: {source: file, path: ledger/sync.py}
    pattern: max_retries
    match: contains
expected_outcome: Claude loads the code-comments skill and adds a max_retries argument to push().
