schema_version: "1.1"
name: load-fix-double-discount
description: A bug fix that never mentions comments. The skill should load.
tags: [activation, should-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Customers with a coupon are getting the discount applied twice in ledger/pricing.py. Can you fix it?
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: loads-code-comments
    tool: Skill
    input_match: code-comments
    min: 1
    arm: both
  - type: regex
    name: discount-applied-once
    target: {source: file, path: ledger/pricing.py}
    pattern: coupon\.rate
    match: count:1
expected_outcome: Claude loads the code-comments skill and fixes calc so the coupon is subtracted once.
