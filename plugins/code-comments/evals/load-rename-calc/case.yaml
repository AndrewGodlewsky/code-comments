schema_version: "1.1"
name: load-rename-calc
description: A rename refactor that never mentions comments. The skill should load.
tags: [activation, should-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Rename calc in ledger/pricing.py to compute_total and update everything that calls it.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: loads-code-comments
    tool: Skill
    input_match: code-comments
    min: 1
    arm: both
  - type: regex
    name: caller-renamed
    target: {source: file, path: ledger/report.py}
    pattern: compute_total
    match: contains
expected_outcome: Claude loads the code-comments skill and renames calc to compute_total in pricing.py and report.py.
