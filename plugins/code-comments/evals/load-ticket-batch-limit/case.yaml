schema_version: "1.1"
name: load-ticket-batch-limit
description: A ticket-driven change that carries a reason and never mentions comments. The skill should load.
tags: [activation, should-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: The payment API now rate-limits us to 5 invoices per request (ticket PAY-212). Update ledger/sync.py so a batch never goes over that.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: loads-code-comments
    tool: Skill
    input_match: code-comments
    min: 1
    arm: both
  - type: regex
    name: batch-limit-is-five
    target: {source: file, path: ledger/sync.py}
    pattern: BATCH_LIMIT\s*=\s*5\b
    match: contains
expected_outcome: Claude loads the code-comments skill and sets BATCH_LIMIT to 5.
