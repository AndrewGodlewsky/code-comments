schema_version: "1.1"
name: skip-find-callers
description: A search question about the codebase, with no edit. The skill should not load.
tags: [activation, should-not-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Which files in this project import fetch_with_retry?
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: does-not-load-code-comments
    tool: Skill
    input_match: code-comments
    min: 0
    max: 0
    arm: both
  - type: regex
    name: names-sync
    pattern: sync\.py
    match: contains
expected_outcome: Claude names ledger/sync.py without loading the code-comments skill.
