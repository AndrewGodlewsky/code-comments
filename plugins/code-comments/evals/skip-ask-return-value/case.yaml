schema_version: "1.1"
name: skip-ask-return-value
description: A question about the code with no edit or review. The skill should not load.
tags: [activation, should-not-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: What does push() in ledger/sync.py return?
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: does-not-load-code-comments
    tool: Skill
    input_match: code-comments
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: makes-no-edit
    tool: Edit
    min: 0
    max: 0
expected_outcome: Claude answers that push() returns the batches that failed, without loading the code-comments skill.
