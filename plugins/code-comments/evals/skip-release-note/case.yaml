schema_version: "1.1"
name: skip-release-note
description: Non-code writing in a code repository. The skill should not load.
tags: [activation, should-not-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: Write a three-sentence release announcement for customers saying coupons are now applied correctly. Put it in your reply, not in a file.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: does-not-load-code-comments
    tool: Skill
    input_match: code-comments
    min: 0
    max: 0
    arm: both
  - type: regex
    name: mentions-coupons
    pattern: coupon
    flags: i
    match: contains
expected_outcome: Claude writes the announcement without loading the code-comments skill.
