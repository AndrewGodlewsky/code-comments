schema_version: "1.1"
name: skip-explain-comment
description: A request to explain an existing comment, with no edit. The skill should not load.
tags: [activation, should-not-load]
context:
  scaffold_script: place-files.sh
execution:
  prompt: What does the comment above TAX_RATE in ledger/pricing.py mean? Just explain it, don't change anything.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill, Edit, Write]
graders:
  - type: tool_used
    name: does-not-load-code-comments
    tool: Skill
    input_match: code-comments
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: makes-no-edit
    tool: Edit
    min: 0
    max: 0
expected_outcome: Claude explains the tax comment without loading the code-comments skill.
